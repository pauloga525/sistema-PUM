# Integración continua: tipos, lint, pruebas y build.
# La auditoría de dependencias está en security.yml.
name: CI

on:
  push:
    branches: [main, security-update, dev-improvements]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # generate/build no se conectan; prisma.config.ts solo necesita que exista
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  calidad:
    name: Tipos, lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx eslint . --max-warnings=50
      - run: npm run test:unit

  integracion:
    name: Pruebas de integración (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pum
          POSTGRES_PASSWORD: pum
          POSTGRES_DB: pum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pum:pum@localhost:5432/pum_test
      TEST_DATABASE_URL: postgresql://pum:pum@localhost:5432/pum_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # También valida que las migraciones apliquen limpias sobre una base vacía
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pum
          POSTGRES_PASSWORD: pum
          POSTGRES_DB: pum_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pum:pum@localhost:5432/pum_e2e
      E2E_DATABASE_URL: postgresql://pum:pum@localhost:5432/pum_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
